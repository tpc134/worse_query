name: Xcode - Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # 避免依赖的子模块缺失

      - name: Build App (Unsigned)
        env:
          # ===== 请在此处直接填入你的实际 Scheme / Target 名称 =====
          SCHEME_NAME: "worse_query"
        run: |
          # 自动识别工程类型：优先使用 workspace，若无则使用 xcodeproj
          if [ -n "$(find . -maxdepth 2 -name '*.xcworkspace' -print -quit)" ]; then
            BUILD_PATH=$(find . -maxdepth 2 -name '*.xcworkspace' -print -quit)
            FLAG="-workspace"
          else
            BUILD_PATH=$(find . -maxdepth 2 -name '*.xcodeproj' -print -quit)
            FLAG="-project"
          fi

          echo "Target File: $BUILD_PATH"
          echo "Scheme: $SCHEME_NAME"

          # 编译 Release 真机产物并强制关闭签名
          xcodebuild clean build \
            $FLAG "$BUILD_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package to IPA
        run: |
          mkdir -p Payload
          # 提取编译输出的 .app 目录
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found!"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r -9 "output.ipa" Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: output.ipa
          if-no-files-found: error
