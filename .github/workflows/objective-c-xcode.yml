name: Xcode - Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15 # 使用最新的 macOS 运行机环境

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Latest Xcode
        run: |
          # 查找本机预装的最高版本 Xcode 并激活
          LATEST_XCODE=$(ls -d /Applications/Xcode_* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Build App (Unsigned)
        env:
          SCHEME_NAME: "worse_query"
        run: |
          if [ -n "$(find . -maxdepth 2 -name '*.xcworkspace' -print -quit)" ]; then
            BUILD_PATH=$(find . -maxdepth 2 -name '*.xcworkspace' -print -quit)
            FLAG="-workspace"
          else
            BUILD_PATH=$(find . -maxdepth 2 -name '*.xcodeproj' -print -quit)
            FLAG="-project"
          fi

          xcodebuild clean build \
            $FLAG "$BUILD_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package to IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found!"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r -9 "output.ipa" Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: output.ipa
          if-no-files-found: error
