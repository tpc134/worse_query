name: Xcode - Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    # 全局环境变量：修改此处即可全局同步
    env:
      SCHEME_NAME: "worse_query"
      TARGET_IOS_VERSION: "18.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Fix Xcode Project Version & Build
        run: |
          # 降级工程内部格式
          find . -name "project.pbxproj" -exec sed -i '' -E 's/objectVersion = [0-9]+/objectVersion = 60/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' -E 's/preferredProjectObjectVersion = [0-9]+/preferredProjectObjectVersion = 60/g' {} +

          # 替换工程内定义的 Deployment Target
          find . -name "project.pbxproj" -exec sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+/IPHONEOS_DEPLOYMENT_TARGET = ${TARGET_IOS_VERSION}/g" {} +

          if [ -n "$(find . -maxdepth 2 -name '*.xcworkspace' -print -quit)" ]; then
            BUILD_PATH=$(find . -maxdepth 2 -name '*.xcworkspace' -print -quit)
            FLAG="-workspace"
          else
            BUILD_PATH=$(find . -maxdepth 2 -name '*.xcodeproj' -print -quit)
            FLAG="-project"
          fi

          # 编译 Release 真机产物
          xcodebuild clean build \
            $FLAG "$BUILD_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET="$TARGET_IOS_VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package to IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found!"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/

          # 确保 Info.plist 的 MinimumOSVersion 严格对齐全局变量
          INFO_PLIST="Payload/$(basename "$APP_PATH")/Info.plist"
          if [ -f "$INFO_PLIST" ]; then
            echo "Setting MinimumOSVersion to $TARGET_IOS_VERSION"
            plutil -replace MinimumOSVersion -string "$TARGET_IOS_VERSION" "$INFO_PLIST"
          fi

          zip -r -9 "worse_query.ipa" Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: worse_query-ipa
          path: worse_query.ipa
          if-no-files-found: error
