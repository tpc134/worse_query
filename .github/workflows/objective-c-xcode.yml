name: Xcode - Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Fix Xcode Project Version & Build
        env:
          SCHEME_NAME: "worse_query"
        run: |
          # 自动降级工程版本号，彻底解决 (110) 兼容性报错
          find . -name "project.pbxproj" -exec sed -i '' -E 's/objectVersion = [0-9]+/objectVersion = 60/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' -E 's/preferredProjectObjectVersion = [0-9]+/preferredProjectObjectVersion = 60/g' {} +

          # 自动识别 workspace 或 xcodeproj
          if [ -n "$(find . -maxdepth 2 -name '*.xcworkspace' -print -quit)" ]; then
            BUILD_PATH=$(find . -maxdepth 2 -name '*.xcworkspace' -print -quit)
            FLAG="-workspace"
          else
            BUILD_PATH=$(find . -maxdepth 2 -name '*.xcodeproj' -print -quit)
            FLAG="-project"
          fi

          echo "Target File: $BUILD_PATH"
          echo "Scheme: $SCHEME_NAME"

          # 编译 Release 真机架构并完全关闭代码签名
          xcodebuild clean build \
            $FLAG "$BUILD_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package to IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found!"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r -9 "worse_query.ipa" Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: worse_query-ipa
          path: worse_query.ipa
          if-no-files-found: error
